name: Deploy Develop

on:
  push:
    branches: [develop]

# Required GitHub Secrets:
# ANDROID_KEYSTORE_BASE64    - base64-encoded .jks keystore file
# ANDROID_KEY_ALIAS          - keystore alias
# ANDROID_KEY_PASSWORD       - key password
# ANDROID_STORE_PASSWORD     - store password
# PLAY_STORE_JSON_KEY        - Google Play service account JSON
# APPLE_P12_CERT_BASE64      - Apple distribution certificate (base64)
# APPLE_P12_PASSWORD         - Certificate password
# APPLE_PROVISIONING_PROFILE_BASE64 - Provisioning profile (base64)
# APPLE_ISSUER_ID            - App Store Connect API issuer ID
# APPLE_API_KEY_ID           - App Store Connect API key ID
# APPLE_API_KEY_P8           - App Store Connect .p8 key contents

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android - Internal Testing
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Set build number from GitHub run number
      - name: Set build number
        run: |
          CURRENT_VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          sed -i "s/^version: .*/version: ${CURRENT_VERSION}+${{ github.run_number }}/" pubspec.yaml
          echo "Building version: ${CURRENT_VERSION}+${{ github.run_number }}"

      # Decode signing key
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload to Play Store Internal Testing
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - run: |
          gem install fastlane
          cd android && fastlane internal
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab

  ios:
    name: iOS - TestFlight
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Set build number
      - name: Set build number
        run: |
          CURRENT_VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          sed -i '' "s/^version: .*/version: ${CURRENT_VERSION}+${{ github.run_number }}/" pubspec.yaml
          echo "Building version: ${CURRENT_VERSION}+${{ github.run_number }}"

      # Import signing certificate
      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_P12_CERT_BASE64 }}
          p12-password: ${{ secrets.APPLE_P12_PASSWORD }}

      # Import provisioning profile
      - name: Import provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Build IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        run: |
          gem install fastlane
          cd ios && fastlane beta
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ios-${{ github.run_number }}
          path: build/ios/ipa/*.ipa
