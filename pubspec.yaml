name: kamili_social
description: "Kamili Social - Social Media Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # GraphQL
  graphql_flutter: ^5.1.0
  graphql: ^5.1.0

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^14.0.0

  # Auth & Security
  flutter_secure_storage: ^9.2.0
  jwt_decoder: ^2.0.1

  # UI
  smooth_page_indicator: ^1.1.0
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  intl: ^0.19.0

  # Utilities
  connectivity_plus: ^6.0.0
  url_launcher: ^6.2.0
  share_plus: ^9.0.0
  image_picker: ^1.0.0
  permission_handler: ^11.3.0
  package_info_plus: ^8.0.0
  logger: ^2.0.0
  shared_preferences: ^2.2.0
  http: ^1.2.0
  mime: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  mockito: ^5.4.0
  mocktail: ^1.0.0

  # App Icon & Splash generation
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/kamili-social-icon-1024x1024.png"
  adaptive_icon_background: "#FAFBFC"
  adaptive_icon_foreground: "assets/images/kamili-social-icon-1024x1024.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FAFBFC"
  image: assets/images/kamili-social-logo.png
  android_12:
    color: "#FAFBFC"
    icon_background_color: "#FAFBFC"
    image: assets/images/kamili-social-icon.png
  ios: true
  android: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
